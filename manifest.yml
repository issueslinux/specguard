modules:
  jira:issuePanel:
    - key: specguard-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: SpecGuard - Acceptance Evidence
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: backend/index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/6f5132b0-059b-4210-871d-8295908ff02c
permissions:
  scopes:
    - read:jira-work
