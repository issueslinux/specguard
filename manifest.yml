modules:
  jira:issuePanel:
    - key: specguard-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: SpecGuard - Acceptance Evidence
  function:
    - key: resolver
      handler: src/backend/index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  # Replace after registering the app with `forge register`.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
permissions:
  scopes:
    - read:jira-work
